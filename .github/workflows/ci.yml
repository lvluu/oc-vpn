name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Lint shell scripts
        run: |
          shellcheck -s bash -x --severity=warning bin/oc-vpn
          shellcheck -s bash -x --severity=warning lib/*.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core
        run: |
          git clone --depth 1 https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local

      - name: Install dependencies
        run: sudo apt-get install -y wireguard-tools curl iproute2 iptables

      - name: Install gum
        run: |
          GUM_VERSION=$(curl -sL https://api.github.com/repos/charmbracelet/gum/releases/latest | grep '"tag_name"' | sed 's/.*"v\(.*\)".*/\1/')
          curl -sL "https://github.com/charmbracelet/gum/releases/download/v${GUM_VERSION}/gum_${GUM_VERSION}_amd64.deb" -o /tmp/gum.deb
          sudo dpkg -i /tmp/gum.deb

      - name: Run tests
        run: bats test/*.bats --verbose-run
