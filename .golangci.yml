version: "2"

run:
  timeout: 5m

linters:
  default: standard

  enable:
    - copyloopvar
    - gocritic
    - misspell
    - nilerr
    - unconvert
    - unparam
    - wastedassign

  disable:
    - errname
    - exhaustruct

  settings:
    govet:
      enable-all: true
    staticcheck:
      checks:
        - all
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam
        - rangeValCopy

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - unparam
          - gocritic

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/lvluu/oc-vpn

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
