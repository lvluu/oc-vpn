version: 2

project_name: oc-vpn

before:
  hooks:
    - go mod tidy
    - go test -count=1 ./...

builds:
  - id: oc-vpn
    main: ./cmd/oc-vpn
    binary: oc-vpn
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    flags:
      - -trimpath

archives:
  - id: default
    format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - install.sh

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  github:
    owner: lvluu
    name: oc-vpn
  draft: false
  prerelease: auto
  extra_files:
    - glob: install.sh
